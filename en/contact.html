<!DOCTYPE html><html lang="en"> <head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="milos oroz - just a dev living in vienna, austria"><link rel="icon" type="image/svg+xml" href="/favicon.ico"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><title>Contact</title><link rel="stylesheet" href="/_astro/_slug_.Da9nfX1g.css">
<link rel="stylesheet" href="/_astro/_slug_.CHdUSOr8.css"></head> <body class="min-h-screen flex flex-col bg-white text-black antialiased"> <header class="fixed top-0 left-0 right-0 bg-white z-50"> <nav class="flex items-center justify-end px-6 py-4"> <div class="flex items-center gap-3 text-xs"> <a href="/en/contact.html" class="text-black hover:text-black transition-colors">EN</a> <span class="text-gray-300">|</span> <a href="/de/contact.html" class="text-gray-400 hover:text-black transition-colors">DE</a> </div> </nav> </header> <main class="flex-1 flex items-center justify-center"> <div class="w-full max-w-xl px-6 py-12">  <div class="flex items-center justify-center min-h-[calc(100vh-160px)]"> <div class="w-full max-w-xl px-6"> <form id="contact-form" class="max-w-xl w-full animate-fade-in"> <div class="mb-6"> <label for="email" class="block text-xs md:text-sm text-gray-600 mb-1">email</label> <input type="email" id="email" name="email" required class="w-full px-4 py-2 border border-gray-300 focus:border-gray-500 focus:outline-none transition-colors bg-white"> </div> <div class="mb-6"> <label for="message" class="block text-xs md:text-sm text-gray-600 mb-1">your message..</label> <textarea id="message" name="message" rows="6" required class="w-full px-4 py-2 border border-gray-300 focus:border-gray-500 focus:outline-none transition-colors bg-white"></textarea> </div> <div class="text-right"> <button type="submit" class="px-6 py-2 text-xs md:text-sm text-gray-600 hover:text-black hover:opacity-70 transition-all duration-200"> submit </button> </div> <p id="success-message" class="hidden text-green-600 mt-4 text-xs md:text-sm"> message sent! thank you </p> <p id="error-message" class="hidden text-red-500 mt-4 text-xs md:text-sm">
Something went wrong. Please try again.
</p> </form> <script type="module">const t=document.getElementById("contact-form"),o=document.getElementById("success-message"),s=document.getElementById("error-message"),e=t?.querySelector('button[type="submit"]');t?.addEventListener("submit",async a=>{a.preventDefault();const n=new FormData(t);e.textContent="...",e.disabled=!0,s?.classList.add("hidden");try{(await fetch("https://api.oroz.space/api/feedback",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:n.get("email"),message:n.get("message"),source:"milos",type:"contact"})})).ok?(o.classList.remove("hidden"),t.reset()):s.classList.remove("hidden")}catch{s.classList.remove("hidden")}finally{e.disabled=!1,e.textContent="submit",setTimeout(()=>o.classList.add("hidden"),6e3)}});</script> </div> </div>  </div> </main> <footer class="fixed bottom-0 left-0 right-0 bg-white"> <nav class="flex justify-center items-center gap-10 py-4 text-xs text-gray-400"> <a href="/en/" class="hover:text-gray-600 transition-colors"> <i class="fa fa-user text-sm"></i> </a> <a href="/en/contact" class="hover:text-gray-600 transition-colors"> <i class="fa fa-envelope text-sm"></i> </a> <a href="/en/blog" class="hover:text-gray-600 transition-colors"> <i class="fa fa-pencil text-sm"></i> </a> </nav> </footer> </body></html>
